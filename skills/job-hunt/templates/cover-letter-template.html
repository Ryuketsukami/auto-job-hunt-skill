<!doctype html>
<!--
  Cover letter. Only used when the employer explicitly asks for one.

  Four rules, from reference/cv-doctrine.md#cover-letters:
    1. Eighty words maximum in the body. Not "about eighty" - count them.
    2. Written like a person speaking, with a point of view. Not a candidate
       performing enthusiasm, not something that reads as optimised.
    3. About the COMPANY - what they do, why it matters, the product that makes a
       difference to somebody. The technologies are the CV's job.
    4. No sentence may survive a find-and-replace of the company name.

  Voice: first person here, because the person is the sender. Never "on behalf of".
  Never any indication that an agent wrote or submitted it.

  Many employers want this as email body text rather than an attachment. When it is
  body text, this file is still where the sent version is stored - only letters that
  were actually sent get kept.

  Render:
    python3 <skill-dir>/scripts/render.py <role-dir> --cover
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>{{FULL_NAME}} - {{COMPANY}}</title>
<style>
  @page { size: A4; margin: 22mm 20mm; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
    color: #1b1f2a;
    font-size: 11px;
    line-height: 1.55;
  }
  .name { font-size: 20px; font-weight: 800; color: #22345e; margin: 0; letter-spacing: -0.3px; }
  .contact { margin: 5px 0 0; font-size: 9.6px; color: #5a6172; }
  .contact .dot { color: #b7bdca; margin: 0 6px; }
  .rule { height: 2px; background: #22345e; margin: 10px 0 18px; }
  .meta { color: #737b8c; font-size: 10px; margin: 0 0 16px; }
  p { margin: 0 0 11px; color: #2b3040; }
  .sign { margin-top: 18px; color: #2b3040; }
</style>
</head>
<body>

  <h1 class="name">{{FULL_NAME}}</h1>
  <div class="contact">
    {{EMAIL}}<span class="dot">·</span>{{PHONE}}<span class="dot">·</span>{{LOCATION}}
  </div>
  <div class="rule"></div>

  <div class="meta">{{DATE}} · {{COMPANY}} · {{ROLE}}</div>

  <!-- Eighty words maximum from here to the sign-off. Count them. -->
  <p>{{BODY}}</p>

  <div class="sign">{{FULL_NAME}}</div>

</body>
</html>
